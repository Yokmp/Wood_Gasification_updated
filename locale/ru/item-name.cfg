wood-gas-processing=Перерабатывает древесину в нефтяной газ, древесную смолу и древесный уголь.
advanced-wood-gas-processing=Открывает гидротермальный пиролиз и паровую газификацию древесной смолы.
wood-syngas-processing=Производит синтез-газ из древесного угля или твёрдого топлива и превращает древесную смолу в сырую нефть.
wood-gas-processing-to-crude-oil=Сохраняет старый процесс производства сырой нефти для существующих фабрик.
