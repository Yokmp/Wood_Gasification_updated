[technology-description]
wood-gas-processing-legacy=Unlocks the original wood gasification and solid-fuel-from-tar processes.
advanced-wood-gas-processing-legacy=Unlocks the original advanced wood gasification process.
wood-gas-processing=Processes wood into petroleum gas, wood tar and charcoal and unlocks early wood-tar processing.
advanced-wood-gas-processing=Unlocks hydrothermal wood pyrolysis and complete steam gasification of wood tar.
wood-syngas-processing=Produces synthesis gas from charcoal or solid fuel and liquefies wood tar into crude oil.
wood-gas-processing-to-crude-oil=Retains the former wood-tar-to-crude-oil process for existing factories.
